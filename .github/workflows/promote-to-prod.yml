# ─────────────────────────────────────────────────────────────────────────────
#  Promoción a PRODUCCIÓN — sin reconstruir
#
#  Se despliega EL MISMO artefacto que se validó en test. No hay build aquí:
#  `docker buildx imagetools create` sólo escribe manifiestos nuevos en GHCR
#  apuntando a las capas que ya existen, así que `prod` y `vX.Y.Z` acaban
#  señalando byte a byte a la imagen que probaste. Reconstruir sería otra
#  imagen distinta y la validación de test no valdría nada.
#
#  Disparadores:
#    · workflow_dispatch  → sin tocar nada promociona lo que corre en test y
#                           publica la versión que elijas en el desplegable
#    · push de un tag v*  → promociona el commit etiquetado y publica vX.Y.Z
#
#  El job usa `environment: production`, que es lo que permite exigir
#  aprobación manual (Settings → Environments → production → required reviewers).
# ─────────────────────────────────────────────────────────────────────────────
name: Promote to prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Artefacto a promocionar. Vacío = el que corre ahora en test'
        required: false
        type: string
      version_bump:
        description: 'Versión a publicar'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - ninguna
      version:
        description: 'Versión exacta, sólo si quieres saltarte el incremento (p. ej. v1.4.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write # commitear el tag desplegado en deploy/prod/stack.env
  packages: write # re-etiquetar en GHCR

# Nunca dos promociones a la vez, y sin cancelar la que ya esté en curso.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: jamataran

jobs:
  promote:
    name: Promocionar a producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `environment: production` es lo que habilita la aprobación manual:
    # Settings → Environments → production → Required reviewers.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # En un push de tag, el checkout apunta al commit etiquetado; nos hace
          # falta el historial completo para poder empujar después sobre main.
          fetch-depth: 0

      # ── Resolver qué se promociona ──────────────────────────────────────
      - name: Resolver tag de origen y versión
        id: vars
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            # Un tag v* apunta a un commit de main que ya pasó por build-and-
            # deploy-test, así que su imagen existe como sha-<short>.
            origen="sha-${GITHUB_SHA::7}"
            version="${GITHUB_REF_NAME}"
            # El tag de git ya existe: es justo lo que ha disparado esto.
            etiquetar='no'
          else
            etiquetar='si'

            # ── Artefacto ────────────────────────────────────────────────
            origen="${INPUT_TAG:-}"
            if [ -z "${origen}" ]; then
              # Por defecto se promociona lo que está corriendo en test, que es
              # exactamente lo que se acaba de validar. Ese fichero lo escribe
              # build-and-deploy-test.yml en cada push a main, así que es la
              # respuesta correcta salvo que quieras promocionar algo más viejo.
              origen="$(sed -n 's/^VEGA_IMAGE_TAG=//p' deploy/test/stack.env | tail -n1)"
              if [ -z "${origen}" ]; then
                echo "::error title=Sin artefacto::deploy/test/stack.env no trae VEGA_IMAGE_TAG y no has indicado ninguno a mano."
                exit 1
              fi
              echo "Sin tag indicado: se promociona el que corre en test, ${origen}."
            fi

            # ── Versión ──────────────────────────────────────────────────
            if [ -n "${INPUT_VERSION}" ]; then
              version="${INPUT_VERSION}"
              if [ "${INPUT_BUMP}" != 'ninguna' ]; then
                echo "::notice title=Versión explícita::Has escrito ${INPUT_VERSION}, así que se ignora el incremento «${INPUT_BUMP}»."
              fi
            elif [ "${INPUT_BUMP}" = 'ninguna' ]; then
              version=''
            else
              # La última versión publicada sale de los tags de git, no de
              # package.json: el fichero se queda atrás en cuanto alguien olvida
              # subirlo, y los tags son lo que de verdad existe.
              ultima="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
              [ -n "${ultima}" ] || ultima='v0.0.0'

              numeros="${ultima#v}"
              mayor="${numeros%%.*}"
              resto="${numeros#*.}"
              menor="${resto%%.*}"
              parche="${resto#*.}"
              parche="${parche%%-*}" # por si algún día hay un v1.2.3-rc1

              case "${INPUT_BUMP}" in
                major) mayor=$((mayor + 1)); menor=0; parche=0 ;;
                minor) menor=$((menor + 1)); parche=0 ;;
                patch) parche=$((parche + 1)) ;;
                *)
                  echo "::error title=Incremento inválido::«${INPUT_BUMP}» no es major, minor, patch ni ninguna."
                  exit 1
                  ;;
              esac

              version="v${mayor}.${menor}.${parche}"
              echo "Última versión publicada: ${ultima} · ${INPUT_BUMP} → ${version}"
            fi
          fi

          # Normalizamos la versión a vX.Y.Z: es habitual teclearla sin la v.
          if [ -n "${version}" ] && [ "${version#v}" = "${version}" ]; then
            version="v${version}"
          fi

          if [ -n "${version}" ] && ! printf '%s' "${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error title=Versión inválida::'${version}' no tiene el formato vX.Y.Z."
            exit 1
          fi

          # Mejor descubrir aquí que la versión está pillada que después de
          # haber re-etiquetado las imágenes y commiteado el despliegue.
          if [ "${etiquetar}" = 'si' ] && [ -n "${version}" ] &&
             git rev-parse -q --verify "refs/tags/${version}" > /dev/null; then
            echo "::error title=Versión ya publicada::El tag ${version} ya existe en git. Elige otro incremento o escribe la versión a mano."
            exit 1
          fi

          # Un tag mal escrito re-etiquetaría una imagen que no es la validada.
          if ! printf '%s' "${origen}" | grep -Eq '^sha-[0-9a-f]{7,40}$'; then
            echo "::error title=Tag inválido::'${origen}' no tiene el formato sha-<short>. Sólo se promocionan imágenes construidas por la CI."
            exit 1
          fi

          {
            echo "source_tag=${origen}"
            echo "version=${version}"
            echo "etiquetar=${etiquetar}"
          } >> "$GITHUB_OUTPUT"

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Comprobar que existe lo que vamos a promocionar ─────────────────
      - name: Verificar que las imágenes de origen existen en GHCR
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
        run: |
          set -euo pipefail
          for imagen in vega-api vega-frontend; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${imagen}:${SOURCE_TAG}"
            echo "Comprobando ${ref}…"
            if ! docker buildx imagetools inspect "${ref}" > /dev/null 2>&1; then
              echo "::error title=Imagen inexistente::No existe ${ref}. Revisa el sha-<short> en el resumen del workflow de test."
              exit 1
            fi
          done

      # ── Re-etiquetado (sin rebuild) ─────────────────────────────────────
      - name: Re-etiquetar como prod y como versión
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          for imagen in vega-api vega-frontend; do
            base="${REGISTRY}/${IMAGE_NAMESPACE}/${imagen}"

            destinos="--tag ${base}:prod"
            if [ -n "${VERSION}" ]; then
              destinos="${destinos} --tag ${base}:${VERSION}"
            fi

            # imagetools create no descarga ni reconstruye nada: copia el
            # manifiesto de origen bajo los nombres de destino.
            # shellcheck disable=SC2086
            docker buildx imagetools create ${destinos} "${base}:${SOURCE_TAG}"

            echo "· ${base}:${SOURCE_TAG} → prod${VERSION:+, ${VERSION}}"
          done

      # ── Registrar el despliegue en git ──────────────────────────────────
      - name: Escribir y commitear el tag desplegado en deploy/prod/stack.env
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Cuando el disparador es un push de tag, el checkout deja HEAD
          # desprendido sobre el commit etiquetado. Nos plantamos sobre la punta
          # de main ANTES de escribir nada, para que el commit del despliegue no
          # quede huérfano ni revierta trabajo posterior.
          git fetch origin main
          git checkout -B registro-despliegue origin/main

          # Se despliega el sha-<short> inmutable, NO el tag flotante `prod`:
          # así el historial de este fichero es el historial de despliegues y
          # el rollback es volver a la línea anterior.
          cat > deploy/prod/stack.env <<EOF
          # Fichero GESTIONADO POR LA CI — no lo edites salvo para hacer rollback.
          # Lo reescribe .github/workflows/promote-to-prod.yml al promocionar.
          #
          # Promocionado desde test el $(date -u '+%Y-%m-%d %H:%M UTC')
          # Commit: ${GITHUB_SHA}${VERSION:+
          # Versión: ${VERSION}}
          VEGA_IMAGE_TAG=${SOURCE_TAG}
          EOF

          # .env es el espejo que Docker Compose sí lee solo al interpolar
          # `image:`. Está en .gitignore, de ahí el `git add -f`.
          cat > deploy/prod/.env <<EOF
          # Espejo de stack.env — GESTIONADO POR LA CI, no lo edites.
          VEGA_IMAGE_TAG=${SOURCE_TAG}
          EOF

          git add deploy/prod/stack.env
          git add -f deploy/prod/.env

          if git diff --cached --quiet; then
            echo "Producción ya estaba en ${SOURCE_TAG}; nada que commitear."
            exit 0
          fi

          # [skip ci]: es un commit de metadatos, no debe disparar otra build.
          git commit -m "chore(deploy): prod -> ${SOURCE_TAG}${VERSION:+ (${VERSION})} [skip ci]"
          git push origin HEAD:main

      # ── Versión ─────────────────────────────────────────────────────────
      #
      #  Sin este paso, calcular el incremento a partir de los tags no serviría
      #  de nada: la siguiente promoción volvería a proponer el mismo número.
      - name: Etiquetar la versión en git
        if: steps.vars.outputs.etiquetar == 'si' && steps.vars.outputs.version != ''
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          # El tag señala al commit del que salió la imagen que va a producción,
          # no a la punta de main: vX.Y.Z tiene que ser el código que corre.
          corto="${SOURCE_TAG#sha-}"
          if ! commit="$(git rev-parse --verify --quiet "${corto}^{commit}")"; then
            echo "::warning title=Commit no resoluble::No se encuentra ${corto} en este checkout, así que ${VERSION} no se etiqueta en git. Las imágenes sí llevan ya ese tag."
            exit 0
          fi

          git tag -a "${VERSION}" "${commit}" \
            -m "Vega ${VERSION} — promocionada a producción desde ${SOURCE_TAG}"

          # Los pushes hechos con GITHUB_TOKEN no disparan workflows, así que
          # esto NO reentra por el trigger `push: tags: v*` de este fichero.
          git push origin "refs/tags/${VERSION}"
          echo "Etiquetado ${VERSION} sobre ${commit}."

      # ── Despliegue ──────────────────────────────────────────────────────
      - name: Disparar el webhook del Portainer de producción
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_PROD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${PORTAINER_WEBHOOK:-}" ]; then
            echo "::warning title=Webhook no configurado::El secreto PORTAINER_PROD_WEBHOOK no existe. Las imágenes ya están re-etiquetadas y el tag commiteado; redespliega el stack a mano desde Portainer."
            exit 0
          fi

          codigo=$(curl -sS -o /tmp/portainer.out -w '%{http_code}' \
            -X POST "${PORTAINER_WEBHOOK}?pullimage=true" || echo '000')

          echo "Respuesta de Portainer: HTTP ${codigo}"
          cat /tmp/portainer.out || true

          case "${codigo}" in
            2*) echo "Redespliegue de producción solicitado correctamente." ;;
            *)  echo "::error title=Webhook fallido::Portainer devolvió HTTP ${codigo}."; exit 1 ;;
          esac

      - name: Resumen
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          {
            echo "### Promocionado a producción"
            echo
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Artefacto | \`${SOURCE_TAG}\` (sin reconstruir) |"
            echo "| Versión | ${VERSION:-sin versión nueva} |"
            echo "| Tags nuevos | \`prod\`${VERSION:+, \`${VERSION}\`} |"
            echo "| Imágenes | \`ghcr.io/${IMAGE_NAMESPACE}/vega-api\`, \`ghcr.io/${IMAGE_NAMESPACE}/vega-frontend\` |"
            echo
            echo "Rollback: pon el \`sha-\` anterior en \`deploy/prod/stack.env\` y redespliega el stack."
          } >> "$GITHUB_STEP_SUMMARY"
